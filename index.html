<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>AETHER LINK</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:#000;color:#fff;overflow:hidden;height:100vh;width:100vw;-webkit-tap-highlight-color:transparent}
#phone-ui{display:none;align-items:center;justify-content:center;height:100vh;width:100vw;user-select:none;-webkit-user-select:none}
#phone-btn{font-size:20px;color:#00ffcc;letter-spacing:2px;border:2px solid #00ffcc;padding:25px 50px;border-radius:50px;background:rgba(0,255,204,0.1);cursor:pointer;touch-action:manipulation;box-shadow:0 0 15px rgba(0,255,204,0.3);transition:all 0.3s}
#phone-btn:active{transform:scale(0.95);background:rgba(0,255,204,0.3)}
#phone-ui.live #phone-btn{opacity:0;transform:scale(0.8)}
#phone-dot{width:6px;height:6px;border-radius:50%;background:#222;position:fixed;top:15px;right:15px}
#phone-ui.live #phone-dot{background:#0f0;box-shadow:0 0 8px #0f0}
#pip-video{position:fixed;top:-100px;left:-100px;width:1px;height:1px;opacity:0;pointer-events:none}
#status-msg{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);color:#ff3355;font-size:12px;text-align:center;display:none;z-index:100}
#laptop-ui{display:none;height:100vh;width:100vw;position:relative;background:#000}
#screen{width:100%;height:100%;object-fit:contain;background:#000;display:block}
#hud{position:fixed;top:0;left:0;right:0;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(0,0,0,.95) 0%,transparent 100%);z-index:10;pointer-events:none;opacity:0;transition:opacity .5s}
#hud.show{opacity:1}
#hud .logo{color:#00ffcc;font-size:13px;font-weight:700;letter-spacing:3px;text-shadow:0 0 10px #00ffcc}
#hud .stats{display:flex;gap:20px;font-size:10px;color:#444}
#hud .stats span{color:#00ffcc;font-weight:600}
#waiting{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
#waiting h2{color:#00ffcc;font-size:14px;letter-spacing:4px;margin-bottom:8px}
#waiting p{color:#333;font-size:10px}
</style>
</head>
<body>

<div id="phone-ui">
  <div id="phone-dot"></div>
  <div id="phone-btn" onclick="activate()">TAP TO CONTINUE</div>
  <video id="pip-video" autoplay playsinline muted></video>
  <div id="status-msg"></div>
</div>

<div id="laptop-ui">
  <div id="waiting">
    <h2>AETHER LINK</h2>
    <p>Waiting for device...</p>
  </div>
  <video id="screen" autoplay playsinline></video>
  <div id="hud">
    <div class="logo">AETHER LINK</div>
    <div class="stats">
      <div>STATE <span id="s-state">WAITING</span></div>
      <div>LATENCY <span id="s-lat">--</span></div>
    </div>
  </div>
</div>

<script>
const isPhone = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
const config = { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' }] } };
let peer, conn, stream;

window.onload = () => {
    if (isPhone) { document.getElementById('phone-ui').style.display = 'flex'; initPhone(); } 
    else { document.getElementById('laptop-ui').style.display = 'block'; initLaptop(); }
};

function showStatus(msg) { const el = document.getElementById('status-msg'); el.innerText = msg; el.style.display = 'block'; setTimeout(() => el.style.display = 'none', 4000); }

function initPhone() {
    peer = new Peer('aether-link-phone', config);
    peer.on('connection', c => { conn = c; conn.on('open', () => { if (localStorage.getItem('aether-on') === '1') activate(); }); conn.on('data', d => { if (d === 'ping') conn.send('pong:' + Date.now()); }); });
    peer.on('error', () => setTimeout(initPhone, 3000));
}

async function activate() {
    if (stream) return;
    showStatus('Initializing link...');

    // METHOD 1: Standard Modern API
    try {
        if (navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia) {
            stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
        } 
        // METHOD 2: Legacy API (Bypasses some Android blocks)
        else if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            stream = await navigator.mediaDevices.getUserMedia({ video: { mediaSource: 'screen' }, audio: false });
        } 
        else { throw new Error('API missing'); }
        
        startStream();
    } catch (e) {
        console.error(e);
        showStatus('System blocked. Clearing cache...');
        // If it fails, it's the Redmi Privacy Shield. 
        alert('The phone OS blocked the link. Go to Chrome Settings > Site Settings > Screen sharing > Allow for github.io');
    }
}

function startStream() {
    document.getElementById('phone-ui').classList.add('live');
    localStorage.setItem('aether-on', '1');
    if (conn?.open) peer.call('aether-link-laptop', stream);
    stream.getVideoTracks()[0].onended = () => { stream = null; document.getElementById('phone-ui').classList.remove('live'); localStorage.removeItem('aether-on'); };
}

function initLaptop() {
    peer = new Peer('aether-link-laptop', config);
    peer.on('open', () => { conn = peer.connect('aether-link-phone'); conn.on('open', () => { document.getElementById('s-state').innerText = 'LINKED'; startPing(); }); conn.on('close', () => setTimeout(() => conn = peer.connect('aether-link-phone'), 3000)); });
    peer.on('call', call => { call.answer(); call.on('stream', s => { document.getElementById('screen').srcObject = s; document.getElementById('waiting').style.display = 'none'; document.getElementById('hud').classList.add('show'); document.getElementById('s-state').innerText = 'LIVE'; }); });
    peer.on('error', () => setTimeout(initLaptop, 3000));
}

function startPing() { setInterval(() => { if (conn?.open) { const t = Date.now(); conn.send('ping'); conn.once('data', d => { if (d.startsWith('pong:')) document.getElementById('s-lat').innerText = (Date.now() - t) + 'ms'; }); } }, 2000); }
</script>
</body>
</html>
